services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketshield
      POSTGRES_PASSWORD: marketshield
      POSTGRES_DB: marketshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://marketshield:marketshield@db:5432/marketshield
      DATABASE_URL_SYNC: postgresql://marketshield:marketshield@db:5432/marketshield
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
